<section class="container py-4" style="max-width: 680px">
  @if (noEncontrado) {
    <div class="card border-0 shadow-sm p-4 bg-white text-center">
      <h2 class="h4 text-danger mb-3">Producto no encontrado</h2>
      <p class="text-muted">El código solicitado no corresponde a ningún registro vigente en el inventario.</p>
      <div>
        <a class="btn btn-primary" routerLink="/">Regresar al Catálogo</a>
      </div>
    </div>
  } @else {
    <div class="card border-0 shadow-sm p-4 bg-white">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1 text-primary">Modificar Producto</h1>
          <span class="badge bg-light text-dark border">Código ID: #{{ id }}</span>
        </div>
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
          {{ categoria }}
        </span>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small">Nombre del Producto (Solo lectura)</label>
        <input class="form-control bg-light" [value]="nombre" readonly disabled />
      </div>

      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <label for="precio" class="form-label fw-semibold">Precio Actualizado (S/)</label>
          <input id="precio" type="number" step="0.10" class="form-control" [(ngModel)]="precio" name="precio" />
        </div>
        <div class="col-12 col-md-6">
          <label for="stock" class="form-label fw-semibold">Stock Físico</label>
          <input id="stock" type="number" class="form-control" [(ngModel)]="stock" name="stock" />
        </div>
      </div>

      @if (mensaje) {
        <div class="alert alert-danger mb-4 py-2">{{ mensaje }}</div>
      }

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-success px-4 fw-semibold" (click)="guardar()">
          Guardar Cambios
        </button>
        <a class="btn btn-outline-secondary px-4" routerLink="/">
          Cancelar
        </a>
      </div>
    </div>
  }
</section>
